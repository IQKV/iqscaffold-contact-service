services:
  # PostgreSQL Database for Contact Service
  postgres-contact:
    extends:
      file: compose.base.yaml
      service: postgres-contact

  # Redis for Contact Service
  redis-contact:
    extends:
      file: compose.base.yaml
      service: redis-contact

  # RabbitMQ for Contact Service
  rabbitmq-contact:
    extends:
      file: compose.base.yaml
      service: rabbitmq-contact

  # Contact Service - Full platform run including build phase
  contact-service:
    extends:
      file: compose.base.yaml
      service: contact-service

networks:
  contact-service-network:
    name: iqscaffold-contact-network-dev
    external: false

volumes:
  postgres_contact_data:
    name: iqscaffold_contact_postgres_data_dev
  redis_contact_data:
    name: iqscaffold_contact_redis_data_dev
  rabbitmq_contact_data:
    name: iqscaffold_contact_rabbitmq_data_dev
  contact_logs:
    name: iqscaffold_contact_logs_dev
  contact_tmp:
    name: iqscaffold_contact_tmp_dev
