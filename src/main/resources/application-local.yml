# Local Development Environment Configuration

spring:
  datasource:
    hikari:
      pool-name: ContactServiceHikariPool-Local

  jpa:
    show-sql: true

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://localhost:5432/iqscaffold_contact_local}
  
  cache:
    redis:
      key-prefix: "iqscaffold:contact:local"
      enable-statistics: true
  
  crm:
    contact:
      enable-email-integration: false
    company:
      enable-company-scoring: false
    activity:
      retention-days: 30

logging:
  level:
    org.hibernate.SQL: DEBUG
