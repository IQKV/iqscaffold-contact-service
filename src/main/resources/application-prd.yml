# Production Environment Configuration

spring:
  datasource:
    hikari:
      pool-name: ContactServiceHikariPool-Production
      maximum-pool-size: 25

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
    pool:
      maximum-size: 50
      minimum-idle: 10
  
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
      key-prefix: "iqscaffold:contact:production"
      default-ttl: PT15M
  
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST}
      username: ${IQSCAFFOLD_MESSAGING_RABBITMQ_USERNAME}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}
  
  liquibase:
    contexts: "!demo"

logging:
  level:
    root: WARN
    com.iqscaffold.contactservice: INFO
    org.hibernate.SQL: WARN
