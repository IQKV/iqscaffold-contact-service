# UAT Environment Configuration

spring:
  datasource:
    hikari:
      pool-name: ContactServiceHikariPool-Staging
      maximum-pool-size: 15
      minimum-idle: 3

iqscaffold:
  database:
    url: ${IQSCAFFOLD_DATABASE_URL:jdbc:postgresql://staging-db:5432/iqscaffold_contact_staging}
    username: ${IQSCAFFOLD_DATABASE_USERNAME}
    password: ${IQSCAFFOLD_DATABASE_PASSWORD}
  
  cache:
    redis:
      host: ${IQSCAFFOLD_CACHE_REDIS_HOST:redis-staging}
      password: ${IQSCAFFOLD_CACHE_REDIS_PASSWORD}
      pool:
        max-active: 16
        min-idle: 2
      key-prefix: "iqscaffold:contact:staging"
      default-ttl: PT30M
  
  messaging:
    rabbitmq:
      host: ${IQSCAFFOLD_MESSAGING_RABBITMQ_HOST:rabbitmq-staging}
      password: ${IQSCAFFOLD_MESSAGING_RABBITMQ_PASSWORD}
  
  crm:
    activity:
      retention-days: 180

logging:
  level:
    org.hibernate.SQL: WARN
